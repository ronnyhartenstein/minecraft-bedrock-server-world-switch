<!doctype html>
<html lang="de">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Minecraft Welten</title>
    <link
      rel="icon"
      type="image/svg+xml"
      href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23000'/%3E%3Crect x='1' y='1' width='14' height='5' fill='%234b8f29'/%3E%3Crect x='1' y='6' width='14' height='9' fill='%237a5a3a'/%3E%3C/svg%3E"
    />
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <header>
      <h1>⛏️ Welt auswählen</h1>
      <p class="subtitle">Wähle deine Welt</p>
    </header>

    <main id="worlds" class="grid">
      <p class="loading">Lade Welten…</p>
    </main>

    <div id="confirm-overlay" class="overlay hidden">
      <div class="confirm-box">
        <p id="confirm-text"></p>
        <div class="confirm-buttons">
          <button id="confirm-yes" class="btn btn-primary">Ja, wechseln</button>
          <button id="confirm-no" class="btn">Abbrechen</button>
        </div>
      </div>
    </div>

    <div id="logs-overlay" class="overlay hidden">
      <div class="logs-box">
        <div class="logs-header">
          <span id="logs-title"></span>
          <button id="logs-close" class="btn">Schließen</button>
        </div>
        <pre id="log-content" class="log-content"></pre>
      </div>
    </div>

    <script src="app.js"></script>
  </body>
</html>
